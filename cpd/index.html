<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CPD">
<title>CPD</title>
<style>
  :root { color-scheme: dark; --bg:#0a0c10; --ink:#c8d0dc; --dim:#78838f; --line:#2a323d;
          --panel:#141922; --hot:#8fd0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
              font:14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding-bottom:calc(env(safe-area-inset-bottom) + 78px); -webkit-user-select:none; user-select:none; }

  /* The picture stays put while you scroll the sliders under it - you are judging the render, so it
     never leaves the screen. */
  #render { position:sticky; top:0; z-index:5; background:#000; border-bottom:1px solid var(--line); }
  #render img { display:block; width:100%; aspect-ratio:16/9; object-fit:contain; background:#000; }
  #render.empty img { display:none; }
  #rmeta { position:absolute; left:10px; bottom:7px; font-size:11px; color:#9fb0c0;
           text-shadow:0 1px 4px #000; pointer-events:none; }
  #rwait { padding:34px 14px; color:var(--dim); text-align:center; font-size:13px; }
  #render:not(.empty) #rwait { display:none; }

  #bar { display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  input[type=search] { flex:1; min-width:0; font:inherit; color:var(--ink); background:#1a1f28;
                       border:1px solid var(--line); border-radius:10px; padding:11px 13px; min-height:46px; }

  .head { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
          border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink);
          font:inherit; padding:16px 14px; text-align:left; }
  .head .n { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .head .c { color:var(--hot); font-size:12px; }

  .row { padding:12px 14px 16px; border-bottom:1px solid #1a212b; }
  .row.dirty { background:#101a25; box-shadow:inset 3px 0 0 var(--hot); }
  .lab { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin-bottom:4px; }
  .nm { font-size:14px; }
  .sec { color:var(--dim); font-size:11px; }
  .v { color:var(--hot); font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* A 46px-tall track with a big thumb: draggable with a thumb, not a fingernail. */
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:46px;
                      background:transparent; margin:0; }
  input[type=range]::-webkit-slider-runnable-track { height:5px; border-radius:3px; background:#2b3542; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:30px;
      border-radius:15px; background:var(--hot); border:3px solid #0d1620; margin-top:-13px; }

  .sw { display:flex; justify-content:space-between; align-items:center; padding:14px; }
  .sw .track { width:54px; height:32px; border-radius:16px; background:#2b3542; position:relative;
               transition:background .15s; flex:none; }
  .sw.on .track { background:#2f6f9f; }
  .sw .track::after { content:''; position:absolute; top:3px; left:3px; width:26px; height:26px;
                      border-radius:13px; background:#dfe7ef; transition:transform .15s; }
  .sw.on .track::after { transform:translateX(22px); }

  footer { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#111620;
           border-top:1px solid var(--line); display:flex; gap:10px; align-items:center;
           padding:12px calc(env(safe-area-inset-right) + 12px)
                   calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px); }
  #n { flex:1; color:var(--dim); font-size:13px; }
  #copy { font:inherit; font-weight:600; color:#fff; background:#2f6f9f; border:0;
          border-radius:10px; padding:13px 20px; min-height:48px; }
  #copy:disabled { background:#232b36; color:var(--dim); }
  #msg { padding:40px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>

<div id="render" class="empty">
  <img id="shot" alt="latest render">
  <div id="rmeta"></div>
  <div id="rwait">waiting for the first render</div>
</div>

<div id="bar"><input id="q" type="search" placeholder="search settings" autocomplete="off"
                     autocapitalize="off" spellcheck="false"></div>
<div id="list"><div id="msg">loading settingsâ€¦</div></div>

<footer><span id="n">no changes</span><button id="copy" disabled>send</button></footer>

<script>
const $ = s => document.querySelector(s);
const LIVE = 'https://raw.githubusercontent.com/mflux/mflux.github.io/master/cpd/live';
let data = null;
const dirty = new Map();

/* ---------- settings ---------------------------------------------------------------------------- */

async function loadSettings(file) {
  try {
    const r = await fetch(`${LIVE}/${file}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d || !Array.isArray(d.sections)) throw new Error('unexpected shape');
    data = d;
    render($('#q').value);
  } catch (e) {
    $('#msg').textContent = 'could not load settings: ' + e.message;
  }
}

function render(query = '') {
  const list = $('#list');
  list.innerHTML = '';
  const q = query.trim().toLowerCase();

  if (q.length >= 2) {
    let n = 0;
    for (const s of data.sections) {
      for (const k of s.knobs)   if (k.name.toLowerCase().includes(q) && n++ < 80) list.append(knobRow(k, s.title));
      for (const t of s.toggles) if (t.name.toLowerCase().includes(q) && n++ < 80) list.append(toggleRow(t, s.title));
    }
    if (!n) list.innerHTML = '<div id="msg">nothing matches</div>';
    return;
  }

  // Rows are built only when a section is opened: hundreds of sliders up front would crawl.
  for (const s of data.sections) {
    const head = document.createElement('button');
    head.className = 'head';
    const changed = [...s.knobs, ...s.toggles].filter(c => dirty.has(c.name)).length;
    head.innerHTML = `<span>${esc(s.title)}</span>`
                   + `<span><span class="c">${changed ? changed + ' changed ' : ''}</span>`
                   + `<span class="n">${s.knobs.length + s.toggles.length}</span></span>`;
    const body = document.createElement('div');
    body.hidden = true;
    head.onclick = () => {
      if (!body.dataset.built) {
        for (const k of s.knobs) body.append(knobRow(k));
        for (const t of s.toggles) body.append(toggleRow(t));
        body.dataset.built = '1';
      }
      body.hidden = !body.hidden;
    };
    list.append(head, body);
  }
}

const esc = s => String(s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const fmt = (x, k) => `${(+x).toFixed(3).replace(/\.?0+$/, '')}${k.unit ? ' ' + k.unit : ''}`;

function knobRow(k, section) {
  const row = document.createElement('div');
  row.className = 'row' + (dirty.has(k.name) ? ' dirty' : '');
  const cur = dirty.has(k.name) ? dirty.get(k.name).value : k.value;
  row.innerHTML = `<div class="lab"><span class="nm">${esc(k.name)}`
                + `${section ? ` <span class="sec">${esc(section)}</span>` : ''}</span>`
                + `<span class="v">${fmt(cur, k)}</span></div>`;
  const out = row.querySelector('.v');

  const sl = document.createElement('input');
  Object.assign(sl, { type: 'range', min: k.min, max: k.max, step: k.step || 0.001, value: cur });
  sl.addEventListener('input', () => {
    out.textContent = fmt(sl.value, k);
    if (+sl.value === k.value) dirty.delete(k.name); else dirty.set(k.name, { value: +sl.value });
    row.classList.toggle('dirty', dirty.has(k.name));
    count();
  });
  row.append(sl);
  return row;
}

function toggleRow(t, section) {
  const row = document.createElement('div');
  const on = dirty.has(t.name) ? dirty.get(t.name).on : t.on;
  row.className = 'row sw' + (on ? ' on' : '') + (dirty.has(t.name) ? ' dirty' : '');
  row.innerHTML = `<span class="nm">${esc(t.name)}`
                + `${section ? ` <span class="sec">${esc(section)}</span>` : ''}</span>`
                + `<span class="track"></span>`;
  row.onclick = () => {
    const next = !row.classList.contains('on');
    row.classList.toggle('on', next);
    if (next === t.on) dirty.delete(t.name); else dirty.set(t.name, { on: next });
    row.classList.toggle('dirty', dirty.has(t.name));
    count();
  };
  return row;
}

/* ---------- hand back ---------------------------------------------------------------------------- */

function count() {
  $('#n').textContent = dirty.size ? `${dirty.size} changed` : 'no changes';
  $('#copy').disabled = !dirty.size;
}

// Posted to a public relay that accepts anonymous writes, which is what lets this work without a
// token in the page. A watcher on the machine picks it up, applies it and publishes a new render.
const RELAY = 'https://ntfy.sh/cpd-fefd95de22fb';

$('#copy').onclick = async () => {
  const text = [...dirty].map(([name, d]) => `${name} = ${'on' in d ? (d.on ? 'on' : 'off') : d.value}`).join('\n');
  const btn = $('#copy');
  btn.disabled = true;
  $('#n').textContent = 'sendingâ€¦';
  try {
    const r = await fetch(RELAY, { method: 'POST', body: text });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    sentAt = Date.now();
    $('#n').textContent = `sent ${dirty.size} â€” rendering`;
  } catch (e) {
    // If the relay is unreachable the work isn't lost: hand it over to be pasted instead.
    $('#n').textContent = 'send failed â€” copy instead';
    btn.disabled = false;
    try { await navigator.clipboard.writeText(text); } catch { prompt('copy this:', text); }
  }
};

$('#q').addEventListener('input', e => data && render(e.target.value));

/* ---------- live render -------------------------------------------------------------------------- */

// A few bytes of state carry the newest capture's stamp; the PNG is only refetched when it moves.
// Filenames arrive over the relay rather than from an index file, because raw.githubusercontent
// caches a path for 300s and ignores query strings - polling a fixed name would show a render up to
// five minutes late. Every capture publishes new names, and a new path is never cached.
let sentAt = 0, since = '12h';

async function pollRender() {
  try {
    const r = await fetch(`${RELAY}-r/json?poll=1&since=${since}`, { cache: 'no-store' });
    const text = (await r.text()).trim();
    if (text) {
      // On a cold load `since=12h` replays the backlog; only the newest describes the current state.
      const msgs = text.split('\n').map(l => JSON.parse(l)).filter(m => m.event === 'message');
      if (msgs.length) {
        const last = msgs[msgs.length - 1];
        since = last.time + 1;
        const m = JSON.parse(last.message);
        $('#shot').src = `${LIVE}/${m.shot}`;
        $('#render').classList.remove('empty');
        $('#rmeta').textContent = m.note ? `${m.note} Â· ${m.stamp}` : m.stamp;
        // The game has taken the changes, so the sliders reload to its real values: a knob snaps to
        // its step, and a rejected one never moved at all.
        if (sentAt) { sentAt = 0; dirty.clear(); count(); }
        await loadSettings(m.params);
      }
    }
  } catch {}
  setTimeout(pollRender, 3000);
}

pollRender();
</script>
</body>
</html>
